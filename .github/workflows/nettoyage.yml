# Supprime les anciennes publications (Merifa est désormais distribuée par le Microsoft Store) et les branches temporaires paquet-*.
# Déclenché par l'envoi d'une branche « nettoyage », supprimée ensuite.
name: Nettoyage
on:
  push:
    branches: ['nettoyage']
permissions:
  contents: write
jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Suppression des publications et de leurs étiquettes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag && echo "supprimée : $tag"
          done
      - name: Suppression des branches temporaires (paquets envoyés à l'Espace partenaires)
        run: |
          for b in $(git ls-remote --heads origin 'paquet-*' | sed 's#.*refs/heads/##'); do git push origin --delete "$b" && echo "supprimée : $b"; done
      - name: Suppression de la branche de déclenchement
        run: git push origin --delete nettoyage
