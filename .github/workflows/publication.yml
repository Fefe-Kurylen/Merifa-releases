# Publication d'une version de Merifa : les fichiers arrivent (découpés en morceaux de moins de 100 Mo)
# sur une branche « morceaux-<version> », puis la même révision est poussée sur « envoi-<version> » ; ce flux les reconstitue, crée la publication GitHub
# (lue par Merifa pour se mettre à jour), puis supprime la branche d'envoi.
name: Publication
on:
  push:
    branches: ['envoi-*']
permissions:
  contents: write
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstitution des fichiers
        working-directory: envoi
        run: |
          for first in *.part000; do
            [ -e "$first" ] || continue
            base="${first%.part000}"
            cat "$base".part* > "$base"
            rm "$base".part*
          done
          sha256sum -c SHA256SUMS
          ls -la
      - name: Publication
        working-directory: envoi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          gh release delete "v$VERSION" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          files=$(ls | grep -v -x -e VERSION -e NOTES.md -e SHA256SUMS)
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --latest \
            --title "Merifa $VERSION" --notes-file NOTES.md $files
      - name: Suppression des branches d'envoi
        run: |
          git push origin --delete "$GITHUB_REF_NAME" || true
          git push origin --delete "morceaux-${GITHUB_REF_NAME#envoi-}" || true
